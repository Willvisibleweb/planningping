<!--
  Supabase → Authentication → Email Templates → "Confirm signup"

  Paste the whole of this into that template. It is not wired up from code:
  Supabase renders it server-side, so editing this file changes nothing until it
  is pasted into the dashboard. Kept in the repo anyway so the template is
  version-controlled and reviewable rather than living only in a web form where
  nobody can see it changed.

  {{ .Token }} is the six-digit code. Without it the email carries no code and
  the code box in the app can never be satisfied — that is the whole mechanism.

  Written as nested tables with inline styles because that is what email
  clients support. Outlook renders with Word's HTML engine: no flexbox, no
  grid, no external stylesheet, and background colours only reliably on table
  cells. Every colour below is a literal, since CSS variables do not resolve in
  email either.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f8f8f9;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#ffffff;border:1px solid #d6e4fb;border-radius:10px;">

        <!-- Wordmark. Text, not an image: images are blocked by default in
             most clients, so a logo would leave a broken box at the top of the
             first email a customer ever gets from us. -->
        <tr>
          <td style="padding:24px 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;letter-spacing:-0.02em;color:#202124;">
            Planning<span style="color:#2563eb;">Ping</span>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:19px;font-weight:600;letter-spacing:-0.02em;color:#202124;">
            Confirm your account
          </td>
        </tr>

        <tr>
          <td style="padding:8px 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6;color:#6b6c70;">
            Enter this code in PlanningPing to finish setting up your account.
          </td>
        </tr>

        <!-- The code. Its own cell with generous letter-spacing so it can be
             read off a phone at a glance and typed without transcription
             errors — 0/O and 1/l confusions are why it is digits only. -->
        <tr>
          <td style="padding:20px 28px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f8ff;border:1px solid #d6e4fb;border-radius:8px;">
              <tr>
                <td align="center" style="padding:18px 12px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:8px;color:#202124;">
                  {{ .Token }}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#757579;">
            The code expires in one hour. If you didn&rsquo;t create a PlanningPing
            account, you can ignore this email &mdash; nothing will happen.
          </td>
        </tr>

        <tr>
          <td style="padding:20px 28px 24px;border-top:1px solid #f1f1f3;margin-top:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#757579;">
            PlanningPing &mdash; construction sales intelligence for UK firms.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
