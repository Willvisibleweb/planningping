# Drives the ingest queue, because Vercel Hobby cannot.
#
# Hobby allows two cron jobs and only daily schedules, so the queue's worker —
# which needs to run every fifteen minutes to be worth having — has no slot.
# GitHub Actions has one, for free, and being outside Vercel is a feature
# rather than a workaround: a scheduler that lives in the system it schedules
# cannot tell you the system did not run.
#
# Vercel still runs /api/cron/ingest once daily as a backstop. That route plans,
# drains and finalises by itself, so if this workflow stops firing the ingest
# degrades to once a day instead of stopping. The two cannot collide: fetching
# is serialised by a Postgres lease (pipeline_locks), planning is idempotent per
# day, and finalising an already-closed day is a no-op.
#
# Setup — one secret, once:
#   gh secret set CRON_SECRET --repo Willvisibleweb/planningping
# and paste the same value as the CRON_SECRET env var in Vercel.
#
# Note: GitHub disables scheduled workflows in repositories with no activity
# for 60 days, and may delay a schedule under load. Neither is a problem while
# the repo is worked on, and the Vercel backstop covers the rest.

name: Ingest queue

on:
  schedule:
    # Plan the day's sources. Runs before the Vercel backstop at 05:00 UTC.
    - cron: '45 4 * * *'
    # Drain the queue. This is the one that matters.
    - cron: '*/15 * * * *'
    # Close the day: discharge sweeps, Monday digest, finish the run.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: Which step to run by hand
        type: choice
        options: [plan, work, finalise]
        default: work

# Never let two of these overlap. The server-side lease would reject the
# second anyway; this keeps the Actions log readable.
concurrency:
  group: ingest-queue
  cancel-in-progress: false

env:
  SITE: https://planningping.com

jobs:
  plan:
    name: Queue today's sources
    if: github.event.schedule == '45 4 * * *' || inputs.step == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST ingest-plan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set — skipping. Run: gh secret set CRON_SECRET --repo Willvisibleweb/planningping"
            exit 0
          fi
          curl --fail-with-body -sS -m 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE/api/cron/ingest-plan" | tee response.json
          echo

  work:
    name: Drain the queue
    if: github.event.schedule == '*/15 * * * *' || inputs.step == 'work'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A 202 here means another worker holds the lease — expected, not a
      # failure. --fail-with-body only trips on 4xx/5xx, so the step stays
      # green for 202 and goes red for a real error, which is the alerting:
      # a failed run emails whoever owns the repo, for nothing.
      - name: POST ingest-work
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set — skipping. Run: gh secret set CRON_SECRET --repo Willvisibleweb/planningping"
            exit 0
          fi
          curl --fail-with-body -sS -m 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE/api/cron/ingest-work" | tee response.json
          echo

      # Surface the queue state in the run summary, so the Actions page is a
      # usable view of the day without opening the database.
      - name: Summarise
        if: always()
        run: |
          if [ -f response.json ]; then
            {
              echo '### Ingest queue'
              echo '```json'
              cat response.json
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  finalise:
    name: Close the day
    if: github.event.schedule == '0 21 * * *' || inputs.step == 'finalise'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST ingest-finalise
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set — skipping. Run: gh secret set CRON_SECRET --repo Willvisibleweb/planningping"
            exit 0
          fi
          curl --fail-with-body -sS -m 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE/api/cron/ingest-finalise" | tee response.json
          echo
